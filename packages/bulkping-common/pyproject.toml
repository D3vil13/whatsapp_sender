[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkping-common"
version = "0.1.0"
description = "Shared utilities for BulkPing microservices"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bulkping_common*"]
