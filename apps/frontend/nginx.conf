server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 256;

    # Static assets — cache aggressively
    location /css/  { expires 7d; add_header Cache-Control "public"; }
    location /js/   { expires 7d; add_header Cache-Control "public"; }
    location /config/ { expires 7d; add_header Cache-Control "public"; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
