worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Re-resolve Docker DNS so restarts don't leave stale upstream IPs (502 errors).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        client_max_body_size 25m;

        location /api/auth/ {
            set $upstream http://auth-service:8001;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/instance/ {
            set $upstream http://instance-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/contacts/ {
            set $upstream http://contacts-service:8003;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            client_max_body_size 25m;
        }

        location /api/groups/ {
            set $upstream http://contacts-service:8003;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/campaigns/ {
            set $upstream http://campaigns-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/chatbot/ {
            set $upstream http://chatbot-service:8005;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /webhooks/ {
            set $upstream http://webhook-service:8006;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
